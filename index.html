<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Streets of Snake</title>
<style>
  html,body{margin:0;height:100%;background:#05030a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  #keys{font:bold 12px/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase;color:#9a8ab8}
  #keys kbd{display:inline-block;padding:1px 6px;margin-right:6px;font:inherit;color:#3cf0ff;
    background:#120a24;border:1px solid #3cf0ff;border-bottom-width:3px;border-radius:3px}
  #wrap{position:relative;box-shadow:0 0 0 3px #000,0 0 50px rgba(255,60,140,.28),0 0 120px rgba(60,240,255,.14)}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  #crt,#vig{position:absolute;inset:0;pointer-events:none}
  #vig{background:radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.42) 100%)}
</style>
</head>
<body>
<div id="keys"><kbd>Space</kbd>Calls the police</div>
<div id="wrap"><canvas id="game"></canvas><div id="crt"></div><div id="vig"></div></div>
<script>
'use strict';
// =====================================================================
//  STREETS OF SNAKE  -  a 16-bit beat-'em-up flavoured snake game
// =====================================================================
const W=384,H=320,CELL=16,COLS=24,ROWS=16,PFY=32;
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');
cvs.width=W;cvs.height=H;ctx.imageSmoothingEnabled=false;

function resize(){
  const s=Math.min(innerWidth/W,(innerHeight-document.getElementById('keys').offsetHeight-20)/H),sc=s>=2?Math.floor(s):s;
  cvs.style.width=Math.floor(W*sc)+'px';cvs.style.height=Math.floor(H*sc)+'px';
  const a=sc/2;
  document.getElementById('crt').style.background=
    `repeating-linear-gradient(to bottom,transparent 0,transparent ${a}px,rgba(0,0,0,.2) ${a}px,rgba(0,0,0,.2) ${sc}px)`;
}
addEventListener('resize',resize);resize();

// ---------- helpers ----------
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;return[c,g];}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand=(a,b)=>a+Math.random()*(b-a),randi=(a,b)=>Math.floor(rand(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const easeOut=k=>1-Math.pow(1-Math.min(1,Math.max(0,k)),3);
function pcircle(g,cx,cy,r,col){g.fillStyle=col;for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r-y*y));g.fillRect(cx-w|0,cy+y|0,w*2+1,1);}}

// ---------- 5x7 bitmap font ----------
const FONT={A:[14,17,17,31,17,17,17],B:[30,17,17,30,17,17,30],C:[14,17,16,16,16,17,14],D:[28,18,17,17,17,18,28],
E:[31,16,16,30,16,16,31],F:[31,16,16,30,16,16,16],G:[14,17,16,23,17,17,15],H:[17,17,17,31,17,17,17],I:[14,4,4,4,4,4,14],
J:[7,2,2,2,2,18,12],K:[17,18,20,24,20,18,17],L:[16,16,16,16,16,16,31],M:[17,27,21,21,17,17,17],N:[17,17,25,21,19,17,17],
O:[14,17,17,17,17,17,14],P:[30,17,17,30,16,16,16],Q:[14,17,17,17,21,18,13],R:[30,17,17,30,20,18,17],S:[15,16,16,14,1,1,30],
T:[31,4,4,4,4,4,4],U:[17,17,17,17,17,17,14],V:[17,17,17,17,17,10,4],W:[17,17,17,21,21,21,10],X:[17,17,10,4,10,17,17],
Y:[17,17,10,4,4,4,4],Z:[31,1,2,4,8,16,31],'0':[14,17,19,21,25,17,14],'1':[4,12,4,4,4,4,14],'2':[14,17,1,2,4,8,31],
'3':[31,2,4,2,1,17,14],'4':[2,6,10,18,31,2,2],'5':[31,16,30,1,1,17,14],'6':[6,8,16,30,17,17,14],'7':[31,1,2,4,8,8,8],
'8':[14,17,17,14,17,17,14],'9':[14,17,17,15,1,2,12],'!':[4,4,4,4,4,0,4],'.':[0,0,0,0,0,12,12],':':[0,12,12,0,12,12,0],
'-':[0,0,0,31,0,0,0],'>':[8,4,2,1,2,4,8],'<':[2,4,8,16,8,4,2],'?':[14,17,1,2,4,0,4],'/':[1,1,2,4,8,16,16],
'+':[0,4,4,31,4,4,0],',':[0,0,0,0,12,4,8],'(':[2,4,8,8,8,4,2],')':[8,4,2,2,2,4,8],'*':[0,4,21,14,21,4,0],"'":[4,4,8,0,0,0,0]};
const TC=new Map();
function renderText(str,s,col,ol,sh){
  const ot=ol?(s>=3?2:1):0,so=sh?(s>=3?3:1):0,tw=Math.max(1,str.length*6*s-s),th=7*s;
  const[c,g]=mkCanvas(tw+ot*2+so,th+ot*2+so);
  const paint=(ox,oy,cl)=>{for(let i=0;i<str.length;i++){const gl=FONT[str[i]];if(!gl)continue;
    for(let r=0;r<7;r++){const bits=gl[r];if(!bits)continue;g.fillStyle=typeof cl==='string'?cl:cl[r];
      for(let b=0;b<5;b++)if(bits&(16>>b))g.fillRect(ox+(i*6+b)*s,oy+r*s,s,s);}}};
  const ring=(ox,oy,cl)=>{for(let dy=-ot;dy<=ot;dy++)for(let dx=-ot;dx<=ot;dx++)paint(ox+dx,oy+dy,cl);};
  if(sh)ring(ot+so,ot+so,sh);
  if(ot)ring(ot,ot,ol);
  paint(ot,ot,col);
  return c;
}
function drawText(str,x,y,o={}){
  str=String(str).toUpperCase();
  const s=o.scale||1,col=o.color||'#fff',ol=o.outline===undefined?'#000':o.outline,sh=o.shadow||'';
  const key=str+'|'+s+'|'+col+'|'+ol+'|'+sh;
  let c=TC.get(key);
  if(!c){c=renderText(str,s,col,ol,sh);if(TC.size>600)TC.clear();TC.set(key,c);}
  const tw=str.length*6*s-s,ot=ol?(s>=3?2:1):0;
  const dx=o.align==='center'?x-tw/2:o.align==='right'?x-tw:x;
  if(o.alpha!==undefined)ctx.globalAlpha=o.alpha;
  ctx.drawImage(c,Math.round(dx)-ot,Math.round(y)-ot);
  ctx.globalAlpha=1;
}

// ---------- sprites ----------
function makeSprite(rows,pal,outline='#0a0410'){
  const w=Math.max(...rows.map(r=>r.length)),h=rows.length,[c,g]=mkCanvas(w+2,h+2);
  const filled=(x,y)=>y>=0&&y<h&&x>=0&&x<rows[y].length&&rows[y][x]!=='.';
  if(outline){g.fillStyle=outline;for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++){if(filled(x,y))continue;
    if(filled(x-1,y)||filled(x+1,y)||filled(x,y-1)||filled(x,y+1))g.fillRect(x+1,y+1,1,1);}}
  for(let y=0;y<h;y++)for(let x=0;x<rows[y].length;x++){const ch=rows[y][x];if(ch!=='.'){g.fillStyle=pal[ch]||'#f0f';g.fillRect(x+1,y+1,1,1);}}
  return c;
}
function flipH(src){const[c,g]=mkCanvas(src.width,src.height);g.translate(src.width,0);g.scale(-1,1);g.drawImage(src,0,0);return c;}
function whiteOf(src){const[c,g]=mkCanvas(src.width,src.height);g.drawImage(src,0,0);g.globalCompositeOperation='source-in';g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);return c;}

const HEAD=["...YYYYYYYY...","..YYYYYYYYYY..",".YYyYYYyYYYYY.",".RRRRRRRRRRRR.",".rRRRRRRRRRRr.",".YssssssssssY.",
".sWWssssssWWs.",".sWWssssssWWs.",".ssssssssssss.",".sssssnnsssss.","..ssssssssss..","..sssmmmmsss..","...ssssssss...","....SSSSSS...."];
const HEADPAL={Y:'#f8d850',y:'#c09020',R:'#e02030',r:'#901018',s:'#f8b888',S:'#c88060',W:'#ffffff',n:'#d89070',m:'#902830'};
const SPR={};
SPR.head=makeSprite(HEAD,HEADPAL);
SPR.headRage=makeSprite(HEAD,{...HEADPAL,R:'#fff060',r:'#ff8020',Y:'#ffe890'});
SPR.life=makeSprite([".YYYYY.","YRRRRRY","sssssss","sWsssWs","sssssss",".smmms.","..sss.."],HEADPAL);
SPR.apple=makeSprite(["......bg....",".....b.gg...","..rrrbrrr...",".rRWrrrrrr..","rrRWrrrrrrr.","rRRrrrrrrrr.",
"rRrrrrrrrrd.","rrrrrrrrrdd.",".rrrrrrrdd..",".rrrrrrddd..","..rrdddd....","...dd.dd...."],
{r:'#e8202a',R:'#ff6a5a',W:'#ffffff',d:'#9a1020',b:'#5a3010',g:'#3cc030'});
SPR.chicken=makeSprite(["....WW..........","...WWWb.........","....bWbOOO......","......OOYYOOO...",".....OYYOOOOOO..",
"....OYOOOOOOOOd.","....OOOOOOOOOOd.","....dOOOOOOOOdd.",".....ddOOOOddd..",".PPPPPddddddPPP.","PppppppppppppppP",".PPPPPPPPPPPPPP."],
{W:'#f8f0e0',b:'#c8b8a0',O:'#d87a28',Y:'#f8c868',d:'#8a4010',P:'#e8eef8',p:'#a8b0c8'});
SPR.money=makeSprite(["...bb..bb...","....bbbb....",".....tt.....","....tttt....","...tTtttt...","..tTttdddtt.",
".tTttdtttttt",".tTtttddtttt",".tTttttttdtt",".tttttddddtt",".tttttttdtt.","..tttttttt..","...tttttt..."],
{t:'#d8b048',T:'#fff0a0',d:'#6a4a10',b:'#8a6a28'});
SPR.pipe=makeSprite(["..........gG",".........gGg","........gGg.",".......gGg..","......gGg...",".....gGg....",
"....gGg.....","...gGg......","..gGg.......",".kGg........","kkg.........","kk.........."],
{g:'#6a7888',G:'#e0e8f8',k:'#383040'});
SPR.barrel=(()=>{const rows=[];for(let y=0;y<14;y++){let r='';for(let x=0;x<12;x++){let ch;
  if(y===0)ch=(x===0||x===11)?'.':'t';else if(y===13)ch=(x===0||x===11)?'.':'d';else if(y===3||y===10)ch='r';
  else if(y>=5&&y<=8&&x>=5&&x<=7)ch='y';else ch=x<=1?'s':x<=3?'H':x>=9?'s':'b';r+=ch;}rows.push(r);}
  return makeSprite(rows,{t:'#e8a070',d:'#5a1a08',r:'#6a2410',s:'#8a3014',H:'#f09050',b:'#c84a20',y:'#ffd040'});})();
const THUG_A=["....hhhh....","...hhhhhh...","...hhsssss..","...hsssese..","...hsssssss.","....ssssm...","...jjjjjj...",
"..jjJJjjjj..",".jjJjjjjjjj.",".sjjjjjjjjs.",".s.bbbbbb.s.","...pppppp...","...pp..pp...","...pp..pp...","..kkk..kkk.."];
const THUG_B=THUG_A.slice(0,11).concat(["...pppppp...","..pp....pp..","..pp....pp..",".kkk....kkk."]);
const THUG_PALS=[
  {h:'#6a3418',s:'#f0b088',e:'#201010',m:'#a04040',j:'#2f4fb8',J:'#6a8af0',b:'#1a1a1a',p:'#26306a',k:'#120c0c'},
  {h:'#d89868',s:'#e8a878',e:'#201010',m:'#a04040',j:'#e06a18',J:'#ffa050',b:'#2a1a10',p:'#3a3a3a',k:'#120c0c'},
  {h:'#f040c0',s:'#f0b088',e:'#201010',m:'#a04040',j:'#e8d030',J:'#fff080',b:'#1a1a1a',p:'#7a2a7a',k:'#120c0c'}];
SPR.thug=THUG_PALS.map(p=>{const a=makeSprite(THUG_A,p),b=makeSprite(THUG_B,p);return{a,b,af:flipH(a),bf:flipH(b),w:whiteOf(a)};});

// ---------- themes / stages ----------
const THEMES=[
  {name:'CITY STREET',accent:'#ff3c8c',accent2:'#3cf0ff',tint:'rgba(10,4,24,0.58)',build:buildCity,draw:drawCity,key:0},
  {name:'SUNSET BEACH',accent:'#ffb040',accent2:'#ff5aa0',tint:'rgba(26,6,32,0.56)',build:buildBeach,draw:drawBeach,key:3},
  {name:'THE FOUNDRY',accent:'#ff6a20',accent2:'#ffd040',tint:'rgba(16,6,4,0.6)',build:buildFoundry,draw:drawFoundry,key:-2},
  {name:'SYNDICATE TOWER',accent:'#40c0ff',accent2:'#b070ff',tint:'rgba(2,6,14,0.58)',build:buildTower,draw:drawTower,key:5}];
let L=null,BG={},bgT=0;
function buildTheme(i){if(L&&L.idx===i)return;L={idx:i};BG={};THEMES[i].build(L,BG);L.ovl=buildOverlay(THEMES[i]);}
function buildOverlay(T){
  const[c,g]=mkCanvas(W,H);g.fillStyle=T.tint;g.fillRect(0,PFY,W,ROWS*CELL);
  g.fillStyle='rgba(255,255,255,0.035)';
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if((x+y)&1)g.fillRect(x*CELL,PFY+y*CELL,CELL,CELL);
  return c;
}
function skyCanvas(cols,y0,y1){
  const[c,g]=mkCanvas(W,H),n=cols.length,bh=(y1-y0)/n;
  g.fillStyle=cols[0];g.fillRect(0,0,W,y0+1);
  for(let i=0;i<n;i++){const ys=Math.round(y0+i*bh),ye=Math.round(y0+(i+1)*bh);g.fillStyle=cols[i];g.fillRect(0,ys,W,ye-ys);
    if(i<n-1){g.fillStyle=cols[i+1];for(let y=ye-4;y<ye;y++){const d=y-(ye-4);for(let x=0;x<W;x++){
      if(d===0?(x%4===0&&y%2===0):d===1?((x+y)%4===0):d===2?((x+y)%2===0):((x+y)%4!==0))g.fillRect(x,y,1,1);}}}}
  g.fillStyle=cols[n-1];g.fillRect(0,y1,W,H-y1);return[c,g];
}
function wrapDraw(x,off,period,fn){let sx=((x-off)%period+period)%period;if(sx>W+60)sx-=period;if(sx<-90)return;fn(sx);}
function rain(B,dt,slant,col){
  ctx.fillStyle=col;
  for(const d of B.drops){d.y+=d.v*dt;d.x-=d.v*dt*slant;
    if(d.y>H){d.y=-6;d.x=Math.random()*(W+60);if(Math.random()<0.5)B.splash.push({x:d.x,y:292+Math.random()*26,t:0});}
    if(d.x<-6)d.x+=W+12;ctx.fillRect(d.x|0,d.y|0,1,4);}
  ctx.fillStyle='rgba(200,215,255,0.6)';
  for(const s of B.splash){s.t+=dt;const k=s.t/160;ctx.fillRect(s.x-1-k*2|0,s.y-k*2|0,1,1);ctx.fillRect(s.x+1+k*2|0,s.y-k*2|0,1,1);}
  B.splash=B.splash.filter(s=>s.t<160);
}

// ----- ROUND 1: CITY STREET -----
function buildCity(L,B){
  const R=rng(7);
  const[sky,g]=skyCanvas(['#0b0620','#140a35','#22104a','#361458','#521a66','#7a2270','#a82c6e'],32,262);
  pcircle(g,318,78,25,'rgba(255,200,230,0.06)');pcircle(g,318,78,21,'rgba(255,200,230,0.08)');
  pcircle(g,318,78,16,'#f4e6c8');pcircle(g,313,73,3,'#d6c6a6');pcircle(g,323,84,4,'#d6c6a6');pcircle(g,324,71,2,'#d6c6a6');
  L.sky=sky;
  L.stars=[...Array(80)].map(()=>({x:R()*W|0,y:34+R()*170|0,p:R()*7,s:1+R()*3,b:R()<0.12}));
  const LW=768;let[far,fg]=mkCanvas(LW,H),x=0;
  while(x<LW){const w=16+R()*36|0,h=60+R()*130|0,top=266-h;fg.fillStyle='#1c0f3c';fg.fillRect(x,top,w,H-top);
    if(R()<0.35)fg.fillRect(x+(w>>1),top-14,1,14);
    fg.fillStyle='#2e1d60';for(let wy=top+4;wy<262;wy+=6)for(let wx=x+2;wx<x+w-2;wx+=4)if(R()<0.3)fg.fillRect(wx,wy,2,2);
    x+=w+(R()*3|0);}
  L.far=far;
  let[mid,mg]=mkCanvas(LW,H);x=0;L.wins=[];L.signs=[];
  const wc=['#ffd860','#ffd860','#ffb050','#80f0ff','#ff80c0'];
  const names=['BAR','HOTEL','CLUB','24H','DINER','PAWN','GYM','DISCO'];
  while(x<LW-30){const w=36+R()*48|0,h=50+R()*110|0,top=286-h;
    mg.fillStyle='#0c0620';mg.fillRect(x,top,w,H-top);
    mg.fillStyle='#3a1650';mg.fillRect(x+w-2,top,2,H-top);mg.fillStyle='#24123c';mg.fillRect(x,top,w,2);
    if(R()<0.45){mg.fillStyle='#0c0620';const tx=x+6+(R()*(w-20)|0);mg.fillRect(tx,top-14,12,9);mg.fillRect(tx+1,top-5,1,5);
      mg.fillRect(tx+10,top-5,1,5);mg.fillRect(tx-1,top-16,14,2);}
    if(R()<0.5){mg.fillStyle='#1a0c30';for(let fy=top+20;fy<270;fy+=18){mg.fillRect(x+3,fy,14,1);for(let k=0;k<14;k+=3)mg.fillRect(x+3+k,fy-4,1,4);}}
    for(let wy=top+8;wy<280;wy+=9)for(let wx=x+20;wx<x+w-6;wx+=7)if(R()<0.42)L.wins.push({x:wx,y:wy,c:wc[R()*wc.length|0],p:R()*100});
    if(w>44&&R()<0.7){const txt=names[R()*names.length|0],vert=R()<0.45;
      L.signs.push({x:x+(vert?w-16:20),y:top+8,txt,vert,c:R()<0.45?'#ff3c8c':R()<0.6?'#3cf0ff':'#ffe040',m:R()*3|0});}
    x+=w+(R()*6|0);}
  L.mid=mid;
  B.drops=[...Array(130)].map(()=>({x:R()*W,y:R()*H,v:0.35+R()*0.25}));B.splash=[];
  B.train={x:0,on:false,next:3500};B.cars=[];B.carNext=1500;B.heli={x:-60};
}
function drawSign(s,sx,t){
  const on=s.m===0?true:s.m===1?Math.floor(t/700)%2===0:(Math.sin(t*0.05)+Math.sin(t*0.031+s.x))>-0.7;
  const w=s.vert?11:s.txt.length*6+5,h=s.vert?s.txt.length*9+3:11;
  if(on){ctx.globalAlpha=0.18;ctx.fillStyle=s.c;ctx.fillRect(sx-4,s.y-4,w+8,h+8);ctx.globalAlpha=1;}
  ctx.fillStyle='#120818';ctx.fillRect(sx,s.y,w,h);
  ctx.fillStyle=on?s.c:'#3a2040';ctx.fillRect(sx,s.y,w,1);ctx.fillRect(sx,s.y+h-1,w,1);ctx.fillRect(sx,s.y,1,h);ctx.fillRect(sx+w-1,s.y,1,h);
  const o={color:on?'#ffffff':'#3a2040',outline:on?s.c:null};
  if(s.vert)for(let i=0;i<s.txt.length;i++)drawText(s.txt[i],sx+3,s.y+2+i*9,o);else drawText(s.txt,sx+3,s.y+2,o);
}
function drawCity(t,dt){
  const B=BG;ctx.drawImage(L.sky,0,0);
  for(const s of L.stars){const a=0.3+0.7*Math.abs(Math.sin(t*0.0012*s.s+s.p));ctx.globalAlpha=a;ctx.fillStyle='#fff';
    ctx.fillRect(s.x,s.y,1,1);if(s.b&&a>0.85){ctx.fillRect(s.x-1,s.y,3,1);ctx.fillRect(s.x,s.y-1,1,3);}}
  ctx.globalAlpha=1;
  // helicopter with searchlight
  const hx=B.heli.x+=dt*0.018;if(B.heli.x>W+80)B.heli.x=-80;const hy=62+Math.sin(t*0.001)*6|0,ang=Math.sin(t*0.0007)*0.55;
  ctx.fillStyle='rgba(200,225,255,0.07)';ctx.beginPath();ctx.moveTo(hx,hy+5);
  ctx.lineTo(hx+Math.sin(ang)*260-34,hy+230);ctx.lineTo(hx+Math.sin(ang)*260+34,hy+230);ctx.fill();
  ctx.fillStyle='#05030c';ctx.fillRect(hx-7|0,hy,13,6);ctx.fillRect(hx+6|0,hy+2,12,2);ctx.fillRect(hx+17|0,hy-1,1,5);
  ctx.fillRect(hx-7|0,hy+8,13,1);ctx.fillRect(hx-5|0,hy+6,1,2);ctx.fillRect(hx+3|0,hy+6,1,2);
  const rf=Math.floor(t/40)%2;ctx.fillRect(hx-(rf?15:9)|0,hy-2,rf?30:18,1);
  if(Math.floor(t/400)%2){ctx.fillStyle='#ff2020';ctx.fillRect(hx+17|0,hy-2,1,1);}
  ctx.fillStyle='#a0d0ff';ctx.fillRect(hx-6|0,hy+1,3,2);
  // parallax skyline
  const o1=(t*0.004)%768;ctx.drawImage(L.far,-o1,0);ctx.drawImage(L.far,768-o1,0);

function initAudio(){

  const Ctor=window.AudioContext||window.webkitAudioContext;if(!Ctor)return;
  AC=new Ctor();const comp=AC.createDynamicsCompressor();comp.connect(AC.destination);
  master=AC.createGain();master.gain.value=muted?0:0.55;master.connect(comp);
  musicGain=AC.createGain();musicGain.gain.value=0.38;musicGain.connect(master);

const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(f,t,d,type='square',v=0.2,dest=sfxGain,slide){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+0.03);
}
function noise(t,d,v,ftype='highpass',ff=1000,dest=sfxGain){
  const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=ftype;f.frequency.value=ff;
  const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);

function fm(f,t,d,vol,ratio,index,decay,type='sine',dest=musicGain){
  const c=AC.createOscillator(),m=AC.createOscillator(),mg=AC.createGain(),g=AC.createGain();
  c.type=type;c.frequency.value=f;m.frequency.value=f*ratio;
  mg.gain.setValueAtTime(f*index,t);mg.gain.exponentialRampToValueAtTime(f*index*0.15+1,t+decay);
  m.connect(mg);mg.connect(c.frequency);c.connect(g);g.connect(dest);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.005);g.gain.setValueAtTime(vol,t+d*0.5);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);c.start(t);m.start(t);c.stop(t+d+0.03);m.stop(t+d+0.03);
}
function sfx(n){
  if(!AC||muted||G.demo)return;const t=AC.currentTime;

    case 'chicken':[523,659,784,1047].forEach((f,i)=>tone(f,t+i*0.06,0.12,'square',0.13));break;
    case 'money':tone(1318,t,0.07,'square',0.14);tone(1760,t+0.07,0.3,'square',0.14);break;
    case 'rage':tone(110,t,0.5,'sawtooth',0.3,sfxGain,440);noise(t,0.4,0.3,'lowpass',1200);[220,277,330,440].forEach((f,i)=>tone(f,t+i*0.05,0.3,'sawtooth',0.1));break;
    case 'punch':noise(t,0.12,0.6,'lowpass',2200);tone(170,t,0.13,'square',0.35,sfxGain,45);break;
    case 'smash':noise(t,0.3,0.5,'bandpass',900);tone(90,t,0.16,'triangle',0.45,sfxGain,40);break;
    case 'die':tone(880,t,0.7,'square',0.2,sfxGain,55);noise(t,0.35,0.4,'lowpass',800);break;
    case 'siren':for(let i=0;i<6;i++)tone(i%2?660:880,t+i*0.3,0.29,'square',0.1);break;
    case 'rocket':noise(t,0.45,0.3,'highpass',1800);tone(200,t,0.4,'sawtooth',0.1,sfxGain,1400);break;
    case 'boom':noise(t,1.3,0.8,'lowpass',500);tone(80,t,0.9,'sine',0.8,sfxGain,28);break;
    case 'boom2':noise(t,0.35,0.5,'lowpass',900);tone(130,t,0.25,'sine',0.4,sfxGain,40);break;
    case 'extend':[784,988,1175,1568,1976].forEach((f,i)=>tone(f,t+i*0.07,0.12,'square',0.14));break;
    case 'clear':[523,523,523,659,784,0,659,784].forEach((f,i)=>f&&tone(f,t+i*0.12,0.16,'square',0.15));
      [262,262,262,330,392,0,330,392].forEach((f,i)=>f&&tone(f,t+i*0.12,0.16,'triangle',0.25));break;
    case 'go':tone(523,t,0.1,'square',0.18);tone(1047,t+0.1,0.3,'square',0.18);break;
    case 'beep':tone(440,t,0.12,'square',0.15);break;
    case 'tick':tone(1600,t,0.03,'square',0.06);break;
    case 'over':[392,330,262,196].forEach((f,i)=>{tone(f,t+i*0.28,0.3,'square',0.15);tone(f/2,t+i*0.28,0.3,'triangle',0.25);});break;
    case 'thunder':noise(t+0.25,1.8,0.35,'lowpass',260);break;

    case 'pause':tone(880,t,0.06,'square',0.12);tone(660,t+0.07,0.08,'square',0.12);break;
    case 'combo':tone(1200,t,0.05,'square',0.1);tone(1600,t+0.05,0.08,'square',0.1);break;

}

const MEL=[76,0,0,74,76,0,79,0,76,0,74,0,72,0,69,0, 0,0,72,0,74,0,76,0,0,0,74,72,74,0,0,0,
           72,0,0,72,74,0,76,0,77,0,76,0,74,0,72,0, 74,0,0,74,76,0,79,0,81,0,0,0,79,0,76,0];
const BASS=[0,-1,12,-1,0,0,12,-1,0,-1,12,0,-1,12,7,12];
const ROOTS=[0,0,-4,-2],CHORDS=[[0,3,7],[0,3,7],[0,4,7],[0,4,7]];
let seqStep=0,loopN=0,nextNoteTime=0;
function musicOn(){return AC&&!muted&&!G.paused&&['title','intro','play','dying'].includes(G.state);}
function scheduleStep(st,t){
  if(!musicOn())return;
  const spb=60/bpm()/4,bar=(st>>4)&3,s=st&15,root=ROOTS[bar],key=THEMES[G.theme].key,ch=CHORDS[bar];
  if(s%4===0){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+0.12);
    g.gain.setValueAtTime(0.9,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.25);o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+0.3);}
  if(s===4||s===12){noise(t,0.16,0.4,'bandpass',1800,musicGain);tone(190,t,0.08,'triangle',0.25,musicGain);}
  noise(t,s%4===2?0.12:0.03,s%4===2?0.09:0.06,'highpass',8000,musicGain);
  const b=BASS[s];if(b>=0)fm(mtof(33+root+b+key),t,spb*1.7,0.42,1,2.6,0.14);
  if(s===3||s===6||s===11||s===14)for(const c of ch)fm(mtof(57+root+c+key),t,0.14,0.05,1,3,0.07);
  if(loopN%4!==0){const n=MEL[st];if(n){let len=1;while(len<4&&MEL[(st+len)%64]===0)len++;
    fm(mtof(n+key),t,spb*len*0.95,0.12,2,1.6,0.25);tone(mtof(n+key),t,spb*len*0.9,'square',0.025,musicGain);}}
  if(G.rage>0){const n=69+root+ch[s%3]+(s%6>=3?12:0)+key;tone(mtof(n),t,spb*0.8,'square',0.035,musicGain);}
}
function bpm(){return Math.min(150,128+(G.round-1)*4)+(G.rage>0?8:0);}
setInterval(()=>{if(!AC)return;if(nextNoteTime<AC.currentTime-0.2)nextNoteTime=AC.currentTime+0.05;
  while(nextNoteTime<AC.currentTime+0.12){scheduleStep(seqStep,nextNoteTime);nextNoteTime+=60/bpm()/4;seqStep=(seqStep+1)%64;if(seqStep===0)loopN++;}},25);

function aiSafe(x,y){if(!inb(x,y))return false;for(let i=0;i<G.snake.length-1;i++)if(G.snake[i].x===x&&G.snake[i].y===y)return false;
  if(barrelAt(x,y)&&G.rage<=0)return false;if(thugAt(x,y)&&G.rage<=0)return false;return true;}
function flood(sx,sy,lim){const seen=new Set([sx+','+sy]),q=[[sx,sy]];let n=0;
  while(q.length&&n<lim){const[x,y]=q.shift();n++;for(const d of DLIST){const nx=x+d.x,ny=y+d.y,k=nx+','+ny;if(!seen.has(k)&&aiSafe(nx,ny)){seen.add(k);q.push([nx,ny]);}}}return n;}
function aiDir(){
  const h=G.snake[0],ap=G.items.find(i=>i.type!=='apple'&&i.type!=='pipe')||G.items.find(i=>i.type==='apple');let best=G.dir,bs=-1e9;
  for(const d of DLIST){if(d.x===-G.dir.x&&d.y===-G.dir.y)continue;const nx=h.x+d.x,ny=h.y+d.y;if(!aiSafe(nx,ny))continue;
    let s=ap?-(Math.abs(ap.x-nx)+Math.abs(ap.y-ny)):0;if(flood(nx,ny,G.snake.length+8)<G.snake.length+4)s-=100;
    s+=Math.random()*0.5;if(s>bs){bs=s;best=d;}}
  return best;
}

// ---------- update ----------
function tickMs(){if(G.demo)return 95;let t=Math.max(58,128-(G.round-1)*9-G.apples*1.5);if(G.rage>0)t*=0.82;return t;}
function step(){
  if(G.demo)G.dir=aiDir();
  else if(G.queue.length){const d=G.queue.shift();if(!(d.x===-G.dir.x&&d.y===-G.dir.y))G.dir=d;}
  const h=G.snake[0],nx=h.x+G.dir.x,ny=h.y+G.dir.y,inv=G.invuln>0;
  if(!inb(nx,ny))return die();
  const grow=G.grow>0;
  if(!inv)for(let i=0;i<G.snake.length-(grow?0:1);i++){const s=G.snake[i];if(s.x===nx&&s.y===ny)return die();}
  const b=barrelAt(nx,ny);if(b){if(G.rage>0)smashBarrel(b);else if(!inv)return die();}
  const th=thugAt(nx,ny);if(th){if(G.rage>0)koThug(th);else if(!inv)return die();}
  G.snake.unshift({x:nx,y:ny});if(G.grow>0)G.grow--;else G.snake.pop();
  const it=itemAt(nx,ny);if(it)eat(it);
}
function updatePlay(dt){
  if(G.police){updatePolice(dt);return;}
  G.rage=Math.max(0,G.rage-dt);G.invuln=Math.max(0,G.invuln-dt);
  if(G.time>G.nextThug){if(G.thugs.length<maxThugs())spawnThug();G.nextThug=G.time+Math.max(1800,rand(4000,8000)-G.round*300);}
  if(G.time>G.nextBonus){spawnBonus();G.nextBonus=G.time+rand(6000,10000);}
  G.items=G.items.filter(it=>{if(it.ttl!==Infinity&&G.time-it.born>it.ttl){burst(it.x*16+8,PFY+it.y*16+8,['#a0a0a0','#ffffff'],6,0.05);return false;}return true;});
  for(const t of G.thugs){t.mv+=dt;t.mt-=dt*(G.rage>0?1.4:1);if(t.mt<=0){moveThug(t);t.mt=thugInterval();}}
  if(G.demo&&G.special&&G.thugs.length>=3&&Math.random()<0.003)doSpecial();
  G.tickAcc+=dt;
  while(G.tickAcc>=tickMs()&&(G.state==='play'||G.state==='title')&&!G.police){G.tickAcc-=tickMs();step();}
}
function updateFx(dt){
  for(const p of G.parts){p.l+=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}G.parts=G.parts.filter(p=>p.l<p.m);
  for(const p of G.pops)p.t+=dt;G.pops=G.pops.filter(p=>p.t<900);
  for(const f of G.flyers){f.l+=dt;f.vy+=0.0009*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;}G.flyers=G.flyers.filter(f=>f.l<1600&&f.y<H+30);
  for(const e of G.expl)e.t+=dt;G.expl=G.expl.filter(e=>e.t<e.life);
  if(G.banner){G.banner.t+=dt;if(G.banner.t>1300)G.banner=null;}
  G.shake=Math.max(0,G.shake-dt*0.025);G.flash=Math.max(0,G.flash-dt*0.003);

function update(dt){
  bgT+=dt;

  G.time+=dt;G.stateT+=dt;
  switch(G.state){
    case 'title':updatePlay(dt);break;
    case 'intro':if(G.stateT>1500&&G.stateT-dt<=1500)sfx('go');if(G.stateT>2300){G.state='play';G.stateT=0;banner('GO!',ICE,4);}break;
    case 'play':updatePlay(dt);break;
    case 'dying':{G.dieAcc+=dt;while(G.dieAcc>45&&G.dieIdx<G.snake.length){G.dieAcc-=45;const s=G.snake[G.dieIdx++];
        burst(s.x*16+8,PFY+s.y*16+8,['#c8203a','#ff6a7a','#ffd040'],5,0.1);if(G.dieIdx%3===0&&AC&&!muted)tone(300+G.dieIdx*20,AC.currentTime,0.04,'square',0.06);}
      if(G.dieIdx>=G.snake.length&&G.dieAcc>700){G.lives--;
        if(G.lives<=0){G.state='over';G.stateT=0;G.cont=9;saveHi();sfx('over');}
        else{resetSnake();G.invuln=2500;G.special=true;G.state='play';G.stateT=0;
          for(const t of [...G.thugs])if(Math.abs(t.x-4)+Math.abs(t.y-8)<7)koThug(t,false);
          for(const b of [...G.barrels])if(b.y===8&&b.x<9)smashBarrel(b,false);banner('READY!',ICE,3);}}
      break;}
    case 'clear':{if(G.stateT>1400&&G.bonus>0){const n=Math.min(G.bonus,Math.ceil(dt*6));G.bonus-=n;addScore(n);if(Math.floor(G.stateT/50)!==Math.floor((G.stateT-dt)/50))sfx('tick');}
      if(G.bonus<=0&&G.stateT>3800){saveHi();G.round++;startRound();}break;}
    case 'over':{if(G.stateT>1500){const c=9-Math.floor((G.stateT-1500)/1000);if(c!==G.cont){G.cont=c;if(c>=0)sfx('beep');}if(c<0)startDemo();}break;}
  }

}

  dim(0.45);const p=G.stateT;
  drawText('ROUND CLEAR!',W/2,80,{scale:3,color:GOLD,outline:'#201000',shadow:'#000',align:'center'});
  if(p>800){drawText('LENGTH + ROUND BONUS',W/2,130,{color:'#3cf0ff',align:'center'});drawText(String(G.bonus),W/2,144,{scale:2,align:'center'});}
  if(p>1200){drawText('SCORE',W/2,180,{color:'#ffd040',align:'center'});drawText(String(G.score).padStart(7,'0'),W/2,194,{scale:2,align:'center'});}
}
function drawOver(){
  dim(0.7);drawText('GAME OVER',W/2,80,{scale:4,color:['#ffb0b0','#ff7070','#ff3030','#e01010','#b00808','#800404','#500202'],outline:'#100000',shadow:'#000',align:'center'});
  if(G.stateT>1500&&G.cont>=0){drawText('CONTINUE?',W/2,134,{scale:2,color:'#3cf0ff',align:'center'});
    drawText(String(G.cont),W/2,160,{scale:6,color:GOLD,outline:'#201000',shadow:'#000',align:'center'});
    if(Math.floor(bgT/300)%2)drawText('PRESS ENTER',W/2,224,{scale:2,align:'center'});}
  drawText('SCORE '+String(G.score).padStart(7,'0'),W/2,256,{align:'center',color:'#ffd040'});
}
function render(dt){
  ctx.save();if(G.shake>0.5)ctx.translate(randi(-G.shake,G.shake),randi(-G.shake,G.shake));
  THEMES[G.theme].draw(bgT,G.paused?0:dt);
  ctx.drawImage(L.ovl,0,0);drawFrame();
  for(const b of G.barrels)ctx.drawImage(SPR.barrel,b.x*16+1,PFY+b.y*16);
  drawItems();drawThugs();drawSnake();drawFx();drawPolice();drawBanner();
  ctx.restore();drawHUD();
  if(G.state==='title')drawTitle();else if(G.state==='intro')drawIntro();else if(G.state==='clear')drawClear();else if(G.state==='over')drawOver();
  if(G.paused){dim(0.6);drawText('PAUSE',W/2,120,{scale:4,color:ICE,outline:'#001020',shadow:'#000',align:'center'});
    drawText('PRESS P TO RESUME',W/2,170,{align:'center'});}
  if(G.flash>0){ctx.fillStyle=`rgba(255,255,255,${G.flash.toFixed(3)})`;ctx.fillRect(0,0,W,H);}
}

// ---------- input ----------
function queueDir(d){const last=G.queue.length?G.queue[G.queue.length-1]:G.dir;
  if((d.x===last.x&&d.y===last.y)||(d.x===-last.x&&d.y===-last.y))return;if(G.queue.length<3)G.queue.push(d);}
function confirmKey(){
  if(G.state==='title'){newGame();return true;}
  if(G.state==='over'&&G.stateT>1500){continueGame();return true;}
  return false;
}
function togglePause(){if(!['play','intro','dying'].includes(G.state))return;G.paused=!G.paused;sfx('pause');}
const KEYMAP={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};
addEventListener('keydown',e=>{
  const k=e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();
  initAudio();
  if(k==='m'||k==='M'){toggleMute();return;}
  if(k==='Enter'||k===' '){if(confirmKey())return;}
  if(k==='p'||k==='P'||k==='Escape'){togglePause();return;}
  if(G.paused||G.demo)return;
  if(KEYMAP[k]&&(G.state==='play'||G.state==='intro'))queueDir(DIRS[KEYMAP[k]]);
  if((k===' '||k==='x'||k==='X')&&G.state==='play')doSpecial();
});
let tStart=null,lastTap=0;
addEventListener('touchstart',e=>{const t=e.changedTouches[0];tStart={x:t.clientX,y:t.clientY};initAudio();e.preventDefault();},{passive:false});
addEventListener('touchend',e=>{if(!tStart)return;const t=e.changedTouches[0],dx=t.clientX-tStart.x,dy=t.clientY-tStart.y;tStart=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))>22){if(G.demo||G.paused)return;queueDir(Math.abs(dx)>Math.abs(dy)?(dx>0?DIRS.right:DIRS.left):(dy>0?DIRS.down:DIRS.up));}
  else{if(confirmKey())return;const now=performance.now();if(now-lastTap<300&&G.state==='play')doSpecial();lastTap=now;}
  e.preventDefault();},{passive:false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play'&&!G.paused)togglePause();});

// ---------- main loop ----------
startDemo();
let last=performance.now();
function frame(now){const dt=Math.min(50,now-last);last=now;update(dt);render(dt);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
</body>
